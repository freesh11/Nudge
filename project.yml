# XcodeGen spec: `xcodegen generate` turns this into Nudge.xcodeproj.
name: Nudge
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Nudge:
    type: application
    platform: iOS
    sources: [Nudge, Shared]
    dependencies:
      - target: NudgeWidget
    info:
      path: Nudge/Info.plist
      properties:
        CFBundleDisplayName: Nudge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Nudge/Nudge.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nudge.adhd]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nudge.adhd
  NudgeWidget:
    type: app-extension
    platform: iOS
    sources: [NudgeWidget, Shared]
    info:
      path: NudgeWidget/Info.plist
      properties:
        CFBundleDisplayName: Nudge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NudgeWidget/NudgeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nudge.adhd]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nudge.adhd.widget
