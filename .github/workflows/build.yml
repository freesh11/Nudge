name: Build IPA
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the release step attach the .ipa

concurrency: build   # one build at a time, so two pushes can't claim the same version

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest stable Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Pick the next version (1.1, 1.2, …)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '[.[] | select(.tagName | startswith("v1."))] | length')
          echo "MARKETING_VERSION=1.$((n + 1))" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$((n + 1))" >> "$GITHUB_ENV"
      - run: bash build-ipa.sh   # bash, so a lost executable bit from a web upload doesn't matter
      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-unsigned-ipa
          path: Nudge.ipa
      - name: Publish as a release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Nudge.ipa "Nudge-$MARKETING_VERSION-alpha.ipa"
          # Not marked pre-release on purpose: that would stop the /latest/ link from pointing here.
          gh release create "v$MARKETING_VERSION-alpha" Nudge.ipa "Nudge-$MARKETING_VERSION-alpha.ipa" \
            --title "Nudge $MARKETING_VERSION alpha" --notes "Unsigned. Sign it with your certificate, then install."
