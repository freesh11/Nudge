name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash build-ipa.sh   # bash, so a lost executable bit from a web upload doesn't matter
      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-unsigned-ipa
          path: Nudge.ipa
