name: Build IPA
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the release step attach the .ipa

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest stable Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - run: bash build-ipa.sh   # bash, so a lost executable bit from a web upload doesn't matter
      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-unsigned-ipa
          path: Nudge.ipa
      - name: Publish as a release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" Nudge.ipa --title "Nudge build ${{ github.run_number }}" --notes "Unsigned. Sign it with your certificate, then install."
